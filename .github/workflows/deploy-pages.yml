name: deploy-pages

# Deploy runs only after `verify` has passed for the same commit. Before this,
# it triggered directly on push, so a commit that broke the refusal suite, the
# claim inventory or the mutation gate still reached the public site — the one
# hole that could put a regression of any other guarantee in front of a reader.
# `workflow_dispatch` stays as the manual path and is not gated; use it
# knowingly.
on:
  workflow_run:
    workflows: ["verify"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # A finished `verify` run is not a passing one. Without this, a failed
    # verify would still fire `completed` and deploy anyway, which is the
    # original hole wearing a trigger it did not earn.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the commit that verify actually graded, not whatever main
          # points at by the time this job starts.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix app
      - name: Build project-path assets
        env:
          VITE_BASE_PATH: /buildingforgood/
        run: npm --prefix app run build
      # The publication job gates itself: the exact bundle being uploaded is
      # scanned, not just the bundle verify.yml built from the same commit.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Privacy-scan the deployable bundle
        run: |
          python -m pip install --quiet -e "pipeline"
          python -m stillhere_pipeline.privacy --root . --require-bundle
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: app/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
