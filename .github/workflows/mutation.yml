name: mutation

# The characterization suite is only worth what it catches. This deliberately
# breaks both planners and fails if the suite stays green.

on:
  push:
    branches:
      - main
    paths:
      - "app/src/lib/planner.ts"
      - "app/src/domain/planner/**"
      - "app/src/**/planner*.test.ts"
      - "scripts/mutation_check.sh"
      - ".github/workflows/mutation.yml"
  pull_request:
    paths:
      - "app/src/lib/planner.ts"
      - "app/src/domain/planner/**"
      - "app/src/**/planner*.test.ts"
      - "scripts/mutation_check.sh"
      - ".github/workflows/mutation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      - run: ./scripts/mutation_check.sh
