name: verify

on:
  push:
    branches:
      - main
      - "track/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Stage 7 renders the built site and holds it to a text floor and to
      # reflow. It fails rather than skips when the browser is absent, because a
      # skipped gate reports the same green as a passing one.
      - name: Install Chromium and WebKit for the rendered-layout stage
        run: |
          npm --prefix app ci
          npx --prefix app --yes playwright install --with-deps chromium webkit
      - name: Verify (format, lint, types, tests, build, rendered layout)
        run: ./scripts/verify.sh
