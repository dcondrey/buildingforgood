  - id: dsdp_public_monthly_reports
    name: Downtown San Diego Partnership public Unsheltered Sleep Count reports
    role: post_freeze_monitoring
    analytical_question: >-
      What publisher-reported area totals are available after the organizer
      bundle's 2025-12 analytical freeze, on the same six-area core geography?
    publisher: Downtown San Diego Partnership Clean & Safe.
    package_page: https://downtownsandiego.org/clean-and-safe/unhoused-care/
    archive_page: https://downtownsandiego.org/clean-and-safe/archive/
    dashboard_page: https://downtownsandiego.org/dashboard/
    retrieved_at: "2026-08-21"
    files:
      - raw_path: data/raw/dsdp_public_reports/June-2026-Unsheltered-Sleep-Count.pdf
        url: https://downtownsandiego.org/wp-content/uploads/2026/08/June-2026-Unsheltered-Sleep-Count.1.pdf
    derived_files:
      - path: data/monitoring/dsdp_public_checkpoints.csv
        derivation: >-
          Manual transcription of the PDF's April and June 2026 published
          neighborhood totals. Six-area core totals are deterministic sums
          excluding Outside Perimeter and are tested against the seven-area
          publisher totals.
    retrieval_method: >-
      ./scripts/fetch_raw.sh monitoring downloads the allowlisted PDF and
      verifies its pinned SHA-256 digest. HTML archive pages are discovery
      surfaces only and are never ingested wholesale.
    update_cadence: >-
      Irregular in 2025-2026. The dashboard says collection shifted to the
      final month of each quarter, while the June 2026 PDF exposes April and
      June observations only.
    license_terms: >-
      No explicit data license is stated. Attribute DSDP; retain the source
      PDF as an ignored audit snapshot and publish only aggregate transcribed
      values with a direct citation.
    collection_method: >-
      Clean & Safe visual street sweep. Published totals retain DSDP's
      post-2020 practice of applying 1.75 per visible tent/structure and 2.03
      per vehicle showing signs of habitation, although RTFH stopped applying
      those multipliers in 2020.
    intended_use: >-
      Public post-freeze monitoring and provenance checkpoint only. These
      values are excluded from the frozen demo.v1 training, model selection,
      January 2026 historical forecast replay, and outreach-hour planner.
    time_grain: >-
      Report month only. No exact count date is asserted from the summary table.
    geo_grain: >-
      Six named downtown core areas plus Outside Perimeter. The monitoring
      table includes both the published seven-area total and a clearly labeled
      project-derived six-area core total.
    coverage: April and June 2026 in the pinned June 2026 report.
    known_limitations:
      - Visual observations with occupancy multipliers are not unique people or service need.
      - Same publisher and collection lineage as the organizer bundle; not independent validation.
      - >-
        The dashboard labels 1,092 as Q1 2026, but the PDF places 1,092 in
        April and provides no January-March observation. It cannot validate
        the demo's January 2026 historical forecast scenario.
      - Reporting cadence is irregular and missing months remain missing.
      - >-
        The live archive and Unhoused Care HTML contained unrelated injected
        content when reviewed on 2026-08-21. Only allowlisted publisher PDFs
        may be ingested, and every fetched file must match a reviewed hash.

