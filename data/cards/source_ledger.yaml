    coverage: 2026 PITC (January 2026 count); HMIS reports monthly, July 2026 pinned.
    known_limitations:
      - Different universes and clocks than the downtown visual counts; a
        single-night January snapshot cannot validate monthly downtown values.
      - City-of-San-Diego geography is far larger than the six-area core.
      - HMIS activity measures service engagement, not street population.
      - Direction agreement is context, not independent validation of any
        specific downtown figure.

