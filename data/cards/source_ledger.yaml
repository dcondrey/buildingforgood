    known_limitations:
      - Program service rows can overlap; dashboard totals and intervention categories may have different deduplication rules.
      - HMIS coverage depends on provider participation and data quality.
      - Program enrollment is not a count of everyone experiencing homelessness.
      - Bed or program inventory is not live capacity, eligibility, or availability.

  - id: hud_spm_guidance
    name: HUD Continuum of Care System Performance Measures guidance
    role: measurement_definitions
    analytical_question: >-
      Which definitions and data-quality rules distinguish HMIS system
      outcomes from PIT, HIC, and local visual observation counts?
    publisher: U.S. Department of Housing and Urban Development.
    package_page: https://files.hudexchange.info/resources/documents/System-Performance-Measures-Introductory-Guide.pdf
    programming_specifications: https://files.hudexchange.info/resources/documents/System-Performance-Measures-HMIS-Programming-Specifications-September-2023.pdf
    retrieval_method: Reference-only official guidance; not a dataset or demo input.
    update_cadence: Irregular federal guidance revisions.
    license_terms: U.S. federal public document; cite HUD.
    collection_method: >-
      Defines measures calculated from deduplicated client-level HMIS records
      across participating projects and PIT values submitted through HDX.
    intended_use: >-
      Glossary, measurement crosswalk, and responsible-data guardrails only.
    time_grain: Federal fiscal year (October 1 through September 30), except defined PIT inputs.
    geo_grain: Continuum of Care system.
    known_limitations:
      - Guidance contains definitions, not San Diego observations.
      - HMIS system outcomes cannot fill monthly DSDP gaps or validate a downtown forecast.

  - id: hud_ca601_system_reports
    name: HUD CA-601 CoC Performance Profile, HIC, PIT, and System Performance data
    role: annual_coc_context
    analytical_question: >-
      What official annual system outcomes and inventory does HUD report for
      the San Diego City and County Continuum of Care?
    publisher: U.S. Department of Housing and Urban Development.
    package_page: https://www.huduser.gov/portal/datasets/ahar.html
    reference_urls:
      - https://files.hudexchange.info/reports/published/CoC_Perf_CoC_CA-601-2024_CA_2024.pdf
      - https://files.hudexchange.info/reports/published/CoC_HIC_CoC_CA-601-2024_CA_2024.pdf
      - https://www.huduser.gov/portal/datasets/ahar/2024-ahar-part-1-pit-estimates-of-homelessness-in-the-us.html
    retrieval_method: >-
      Reference-only official reports and bulk-data discovery hub. Pin a
      direct file and document its release year before adding any extracted
      measure.
    update_cadence: Annual, with revisions and differing release dates by product.
    license_terms: U.S. federal public data; cite HUD, report year, and CoC CA-601.
    collection_method: >-
      CoC-submitted HMIS System Performance, annual PIT, and point-in-time HIC
      inventory summarized by HUD.
    intended_use: >-
      Annual countywide system context, official definitions, and
      triangulation with Cal ICH. Excluded from the downtown forecast and
      planner.
    time_grain: Annual PIT/HIC snapshot or federal fiscal year, depending on measure.
    geo_grain: CA-601 San Diego City and County Continuum of Care.
    known_limitations:
      - Countywide CoC measures are not downtown-area observations.
      - HIC inventory is not live bed availability or individual eligibility.
      - PIT, HIC, and HMIS measures have different universes and clocks.
      - HUD notes that submitted values receive limited review and are not independently verified.
      - >-
        The former HUD Exchange grantee-report and homelessness-data catalog
        URLs returned 404 when reviewed on 2026-08-21; use pinned direct
        reports and the HUD USER AHAR hub rather than those stale routes.

excluded:
  - id: sdheart
    name: SDHEART (San Diego Homeless and health EquAlity Research Team, SDSU)
    decision: >-
      Evaluated as the preferred source per issue #5 and EXCLUDED as a data
      source: it is an NSF-funded research consortium with visualization
      surfaces only (no downloadable datasets, no API, no license). Fallback to
      the SDRDL packages adopted. Full evaluation: data/cards/sdheart-evaluation.md
