  - id: sdhc_city_program_dashboard
    name: SDHC and City of San Diego Homeless Services Programs Overview
    role: local_system_context
    analytical_question: >-
      What households and program outcomes are recorded in HMIS for
      City/SDHC-funded homelessness programs?
    publisher: San Diego Housing Commission and City of San Diego.
    package_page: https://sdhc.org/homelessness-solutions/city-homeless-shelters-services/dashboard/
    discovery_page: https://www.sandiego.gov/homelessness-strategies-and-solutions/data-reports
    retrieval_method: Reference-only public Tableau dashboard; not a demo input.
    update_cadence: Periodic dashboard refresh; reviewed data were current through 2026-06-30.
    license_terms: No explicit bulk-data reuse license located; cite the dashboard.
    collection_method: >-
      HMIS records reported by participating providers for programs funded by
      the City of San Diego and/or SDHC.
    intended_use: >-
      A separately labeled City-program outcomes card and future outcomes
      lane. Never use as a downtown observation, forecast feature, allocation
      weight, or statement of live service availability.
    time_grain: Fiscal-year and dashboard reporting periods.
    geo_grain: City-funded program system; not the six-area downtown core.
    known_limitations:
      - Program service rows can overlap; dashboard totals and intervention categories may have different deduplication rules.
      - HMIS coverage depends on provider participation and data quality.
      - Program enrollment is not a count of everyone experiencing homelessness.
      - Bed or program inventory is not live capacity, eligibility, or availability.

